name: wagering

x-app: &app
  build: .
  depends_on:
    postgres: { condition: service_healthy }
    localstack: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  environment: &app-env
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: wagering
    DB_PASSWORD: wagering
    DB_NAME: wagering
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    PORT: 3000
  restart: unless-stopped
  stop_grace_period: 40s
  # Ready = PostgreSQL and SQS reachable (GET /health/ready). Lets `docker compose up --wait` mean "serving".
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wagering-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    command: ["bun", "run", "src/infrastructure/persistence/migrate.ts", "up"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Three instances of the same service: the concurrency guarantees are designed for N replicas.
  app-1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ["3001:3000"]
  app-2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    ports: ["3002:3000"]
  app-3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    ports: ["3003:3000"]

volumes:
  pgdata:
